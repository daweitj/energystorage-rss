name: Update RSS feed

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）跑一次；GitHub 定时任务高峰期可能延迟十几分钟到半小时
    - cron: "0 2 * * *"
  workflow_dispatch:   # 支持在 Actions 页面手动点 "Run workflow"

permissions:
  contents: write      # 允许 Action 把新的 feed.xml 提交回仓库

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate feed.xml
        run: python energystorage_rss.py 30

      - name: Verify feed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          t = ET.parse("feed.xml")
          items = t.getroot().findall(".//item")
          assert len(items) >= 5, f"条目过少：{len(items)}"
          print(f"feed 校验通过，条目数 {len(items)}，最新标题：{items[0].findtext('title')}")
          PY

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --staged --quiet; then
            echo "本日无新文章，feed 未变化"
          else
            git commit -m "chore: update feed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
